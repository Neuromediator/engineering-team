[project]
name = "engineering_team"
version = "0.1.0"
description = "engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.10",
    "e2b-code-interpreter>=2.9.0",
    "gradio>=6",
]

[project.scripts]
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run"
run_once = "engineering_team.main:run_once"
race = "engineering_team.main:run_race"
serve = "engineering_team.app:main"
train = "engineering_team.main:train"
replay = "engineering_team.main:replay"
test = "engineering_team.main:test"
run_with_trigger = "engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = [
    "sandbox",
    "sandbox/verify_docker",
    "sandbox/verify_pkg",
    "sandbox/709d1ef9a12d",
    "sandbox/a5e6e01ff759",
    "sandbox/4c625cade498",
    "sandbox/ed33eb37f802",
    "sandbox/6872feacf47e",
    "sandbox/guard",
    "sandbox/6394fc75ab90",
    "sandbox/fdf511247c40",
    "sandbox/e740f20bcd91",
]
