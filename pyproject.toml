[project]
name = "engineering_team"
version = "0.1.0"
description = "engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.10",
    "e2b-code-interpreter>=2.9.0",
    "gradio>=6",
]

[project.scripts]
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run"
run_once = "engineering_team.main:run_once"
race = "engineering_team.main:run_race"
serve = "engineering_team.app:main"
train = "engineering_team.main:train"
replay = "engineering_team.main:replay"
test = "engineering_team.main:test"
run_with_trigger = "engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

# Agents run `uv` inside their sandbox, which leaves a pyproject.toml behind in
# every `sandbox/<run_id>/`. uv adopted each one as a workspace member, so this list
# grew by a line per run — and since `sandbox/` is gitignored, a fresh clone had a
# lockfile pinned to directories that do not exist. Excluding the tree stops uv
# adopting them at all, rather than deleting the entries again after every run.
[tool.uv.workspace]
exclude = ["sandbox/*"]
