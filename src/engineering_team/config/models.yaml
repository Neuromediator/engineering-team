# Single source of truth for model assignment AND pricing.
#
# The observability cost panel reads `pricing` from this same file, so the models the
# crew actually calls and the prices used to cost them cannot drift apart.
#
# Everything routes through OpenRouter, so one OPENROUTER_API_KEY runs the whole crew.
# Re-verify prices against the live catalogue with:
#   uv run python -m engineering_team.model_config --check
#
# Three models, chosen and fixed. Prices are USD per million tokens, verified against
# https://openrouter.ai/api/v1/models on 2026-08-05.
#
# Why these:
#
#   deepseek-v4-pro (manager) — 1M context and $0.435/$0.870. The manager re-sends its
#     accumulated context on every delegation, so its cost is dominated by INPUT tokens
#     and by how much context it can hold before truncating. 80.6% SWE-bench Verified,
#     the strongest open-weights score.
#
#   deepseek-v4-flash-0731 (backend, test) — $0.09/$0.18, 1M context. These roles work
#     against a feedback loop: code runs in the sandbox and errors come back, so a
#     cheap model's mistakes are observable and recoverable. The dated snapshot is
#     pinned deliberately: it is 55% cheaper than the floating `deepseek-v4-flash`
#     ($0.14/$0.28) and reproducible over time.
#
#   minimax-m3 (frontend) — $0.30/$1.20, 1M context. Chosen from benchmarks rather than
#     assumption: 80.5% SWE-bench Verified, statistically tied with DeepSeek V4's
#     leading 80.6%. Kimi K3 tops the Arena.ai Frontend Code Arena (1679 Elo, winning
#     six of seven frontend domains) but costs $3/$15 — that single agent would be ~85%
#     of run cost. A measured run showed the frontend agent's spend is 67% input tokens
#     (it ingests large Context7 doc dumps), so input price and context size are the
#     levers, not output price. M3 also comes from a different family than the DeepSeek
#     manager and workers, so the UI is not generated by a model sharing the exact
#     failure modes of the backend it wraps.

models:
  engineering_lead: openrouter/deepseek/deepseek-v4-pro
  backend_engineer: openrouter/deepseek/deepseek-v4-flash-0731
  frontend_engineer: openrouter/minimax/minimax-m3
  test_engineer: openrouter/deepseek/deepseek-v4-flash-0731
  # QA gates the build/fix loop, so a wrong verdict is expensive in both directions: a
  # false pass ships a broken build, a false fail buys another round of rework. It shares
  # the manager's model rather than the workers' for that reason.
  qa_inspector: openrouter/deepseek/deepseek-v4-pro
  # Intake triage: one short call before a build starts, on the cheapest model.
  # It reads a couple of sentences and returns two booleans, which is not work that
  # rewards a better model — and it runs on every attempt, including the ones that
  # turn out to be someone typing "how are you".
  brief_reviewer: openrouter/deepseek/deepseek-v4-flash-0731

# USD per million tokens.
pricing:
  openrouter/deepseek/deepseek-v4-pro:
    input: 0.435
    output: 0.870
  openrouter/deepseek/deepseek-v4-flash-0731:
    input: 0.09
    output: 0.18
  openrouter/minimax/minimax-m3:
    input: 0.30
    output: 1.20
