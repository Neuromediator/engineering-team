# Tasks deliberately carry no `agent:` key.
#
# Under Process.hierarchical, CrewAI routes every task to the manager_agent regardless
# of what `agent:` says (crew.py: `executing_agent = self.manager_agent if is_hierarchical
# else task.agent`), and the manager decides who does the work. Naming an agent here would
# be documentation that lies. Who *should* do each piece is expressed in the description,
# which the manager actually reads.

design_task:
  description: >
    Take the high level requirements described here and prepare a detailed design for the
    engineering team.
    Here are the requirements: {requirements}
    IMPORTANT: Only output the design in markdown format, laying out the module(s), classes,
    functions. Do not actually write any code. Function or method signatures only.
    The design should make clear which parts belong to the backend python module, which to
    the gradio app, and what the unit tests must cover.
    {constraints}
    Feedback to address from previous rounds of review (on the first attempt this says
    there is none — in that case just build it right the first time):
    {revision_notes}
  expected_output: >
    A detailed design to achieve the requirements, identifying code structure and the work
    each engineer needs to do.
  output_file: sandbox/design.md

code_task:
  description: >
    Have the backend_engineer write the python code that implements the design, in order to
    achieve the requirements.
    Here are the requirements: {requirements}
    {constraints}
    Feedback to address from previous rounds of review (on the first attempt this says
    there is none — in that case just build it right the first time):
    {revision_notes}
  expected_output: >
    Python files written to the sandbox and checked, implementing the design and achieving
    the requirements.
    IMPORTANT: the engineer must use the sandbox tools to write and check the code.
  context:
    - design_task

frontend_task:
  description: >
    Have the frontend_engineer write a gradio UI in a module app.py that demonstrates the
    backend code, as described in the design.
    {constraints}
    Assume there is only 1 user, and have the UI be professional, polished, clean.
    Then have them write a separate validation script (e.g. _validate.py) that imports app.py
    and confirms the Blocks object constructs without error, and run it via the sandbox tools.
    IMPORTANT: the validation script must NOT call `.launch()` — that would block until
    timeout. Just import and instantiate.
    Here are the requirements: {requirements}
    Feedback to address from previous rounds of review (on the first attempt this says
    there is none — in that case just build it right the first time):
    {revision_notes}
  expected_output: >
    A gradio UI in module app.py written to the sandbox that demonstrates the functionality,
    ready to run as-is in the same sandbox directory as the backend code.
  context:
    - code_task
    - design_task

test_task:
  description: >
    Have the test_engineer write unit tests for the backend module, in a single test file,
    using the stdlib `unittest` module.
    Do not write tests for app.py (the gradio frontend).
    Fix any errors in the backend code so that the unit tests pass. Keep working until all
    unit tests pass.
    If any backend code changes, ensure the unit tests still pass and that the gradio app in
    app.py will still work. Avoid changes that might break app.py.
    Feedback to address from previous rounds of review (on the first attempt this says
    there is none — in that case just build it right the first time):
    {revision_notes}
  expected_output: >
    A single test file that can be run to test the backend module, plus a summary of the
    results of running it.
  context:
    - code_task
    - design_task
  output_file: sandbox/test_summary.md

qa_task:
  description: >
    Have the qa_inspector independently verify the delivered system against the original
    requirements, and return a structured report.
    Here are the requirements the system must satisfy: {requirements}
    The inspector must read the sandbox files and RUN the unit tests itself rather than
    trusting any earlier claim that they pass.
    If the inspector reports any blocker- or major-severity findings, delegate the fixes to
    the engineer who owns the affected file, then have the qa_inspector re-verify. Repeat
    until no blocking findings remain, then stop.
    Feedback to address from previous rounds of review (on the first attempt this says
    there is none — in that case just build it right the first time):
    {revision_notes}
  expected_output: >
    A QAReport: `passed` true only if the tests were actually run, all passed, and no
    blocker- or major-severity findings remain. Include `summary`, the list of `findings`
    with severity, file, summary, detail and the requirement each traces to, plus
    `tests_run` and `tests_passed` reflecting what was actually executed.
  context:
    - code_task
    - frontend_task
    - test_task
    - design_task
  output_file: sandbox/qa_report.json
